name: Deploy to Cloudflare Pages

# Preview hosting:
#   - Every pull request gets its own live preview deployment on a
#     branch-scoped *.blitz-leaderboard.pages.dev URL.
#   - Pushes to `main` publish the production deployment.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Token with "Cloudflare Pages: Edit" and "D1: Edit" permissions.
#   CLOUDFLARE_ACCOUNT_ID  Your Cloudflare account ID.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# One in-flight deploy per branch; newer pushes cancel stale runs.
concurrency:
  group: pages-deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Creates the events table on first deploy; a no-op afterwards (IF NOT EXISTS).
      - name: Set up database tables
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute blitz-leaderboard --remote --file=schema.sql

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `pages_build_output_dir` (public/) and Functions (functions/) are
          # read from wrangler.toml. The branch flag decides preview vs.
          # production: any branch other than the project's production branch
          # (main) publishes to a preview URL.
          command: pages deploy --project-name=blitz-leaderboard --branch=${{ github.head_ref || github.ref_name }}

      - name: Summarize deployment
        if: steps.deploy.outputs.deployment-url != ''
        run: |
          echo "### 🎾 Weembledon '95 deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
