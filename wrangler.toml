# Rolax Weembledon '95 - one Cloudflare Worker: static pages from /public plus the /api routes.
# Cloudflare Workers Builds (connected in the dashboard) runs `npx wrangler deploy` on every push.
name = "tennis-leaderboard"
main = "src/index.js"
compatibility_date = "2026-07-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Bundle schema.sql as text so the Worker can create its table on first use.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Umpire password for editing. Visitors can view everything without it.
# Change it here and redeploy. Changing it logs every device out.
[vars]
EDIT_PASSWORD = "Blitzy"

# No database_id needed: `wrangler deploy` creates the D1 database on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "tennis-leaderboard"

# Preview builds (non-production branches, run with `wrangler preview`).
# Previews get no database on purpose, so testing a branch can never touch live
# scores: pages load, and the API answers that data lives on the production site.
[previews.vars]
EDIT_PASSWORD = "Blitzy"
